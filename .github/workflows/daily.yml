name: Daily BAIX update

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 13:00 UTC = 6:30 pm IST, Monday to Friday
  workflow_dispatch:          # also lets you run it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python src/prices.py
      - name: Liquidity check (size and trading value, to the next review cut-off on 30 May 2027)
        run: python src/liquidity.py 2027-05-30
        continue-on-error: true     # a problem here must never stop the index update
      - name: BAIX (LIVE, frozen base date 13 Nov 2026)
        run: python src/index_level.py 2026-11-13 live
      - name: Corporate actions check (splits, special dividends, suspensions)
        run: python src/corporate_actions.py 2026-11-13
        continue-on-error: true     # a problem here must never stop the index update
      - run: python src/site_data.py
      - name: Save updated data and website
        run: |
          git config user.name "baix-bot"
          git config user.email "baix-bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
      - name: Raise the alarm if a corporate action needs a human
        run: |
          if [ -f data/processed/corporate_actions.csv ] && grep -q "ALARM" data/processed/corporate_actions.csv; then
            echo "::error::Corporate action alarm - check data/processed/corporate_actions.csv"
            grep "ALARM" data/processed/corporate_actions.csv
            exit 1
          fi
          echo "No corporate action alarms."
