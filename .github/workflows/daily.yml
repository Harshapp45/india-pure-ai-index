name: Daily BAIX update

on:
  schedule:
    - cron: "0 13 * * 1-5"   # 13:00 UTC = 6:30 pm IST, Monday to Friday
  workflow_dispatch:          # also lets you run it by hand

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python src/prices.py
      - name: Liquidity check (size and trading value, to the launch cut-off)
        run: python src/liquidity.py 2026-11-14
        continue-on-error: true     # a problem here must never stop the index update
      - run: python src/index_level.py 2026-07-01
      - run: python src/site_data.py
      - name: Save updated data and website
        run: |
          git config user.name "baix-bot"
          git config user.email "baix-bot@users.noreply.github.com"
          git add data/ docs/
          git diff --cached --quiet || git commit -m "Daily update $(date -u +%F)"
          git push
